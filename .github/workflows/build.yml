name: build

permissions:
  contents: write

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.7.*"
          cache: true
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxcb1-dev libgl1-mesa-dev ninja-build
      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  windows:
    runs-on: windows-latest
    outputs:
      build_id: ${{ steps.buildid.outputs.BUILD_ID }}
      desktop_size: ${{ steps.hash.outputs.DESKTOP_SIZE }}
      desktop_sha256: ${{ steps.hash.outputs.DESKTOP_SHA256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.7.*"
          cache: true
      - name: Set build id
        id: buildid
        shell: pwsh
        run: |
          $bid = "build-${{ github.run_id }}-${{ github.sha }}"
          Write-Output "BUILD_ID=$bid" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
      - name: Configure
        env:
          ENGLISH3000_BUILD_ID: ${{ steps.buildid.outputs.BUILD_ID }}
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release
      - name: Deploy Qt runtime
        run: windeployqt --release --no-translations build/Release/english3000.exe
      - name: Bundle assets
        run: Copy-Item -Recurse assets build/Release/assets
      - name: Package zip
        run: Compress-Archive -Path build/Release/* -DestinationPath english3000-windows.zip
      - name: Compute hash
        id: hash
        shell: pwsh
        run: |
          $h = Get-FileHash english3000-windows.zip -Algorithm SHA256
          $s = (Get-Item english3000-windows.zip).Length
          Write-Output "DESKTOP_SIZE=$s" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Output "DESKTOP_SHA256=$($h.Hash.ToLower())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: english3000-windows
          path: english3000-windows.zip
      - name: Publish Windows release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = "application/vnd.github+json" }
          $uri = "https://api.github.com/repos/${{ github.repository }}/releases"
          $release = $null
          try { $release = Invoke-RestMethod -Method Get -Uri "$uri/tags/win-latest" -Headers $headers } catch { }
          if ($null -eq $release) {
            $body = @{ tag_name = "win-latest"; name = "Windows 最新版"; body = "自动构建 ${{ github.sha }}"; draft = $false; prerelease = $false } | ConvertTo-Json
            $release = Invoke-RestMethod -Method Post -Uri $uri -Headers $headers -ContentType "application/json" -Body $body
          }
          foreach ($asset in $release.assets) {
            if ($asset.name -eq "english3000-windows.zip") {
              Invoke-RestMethod -Method Delete -Uri "https://api.github.com/repos/${{ github.repository }}/releases/assets/$($asset.id)" -Headers $headers
            }
          }
          $uploadUri = "https://uploads.github.com/repos/${{ github.repository }}/releases/$($release.id)/assets?name=english3000-windows.zip"
          Invoke-RestMethod -Method Post -Uri $uploadUri -Headers $headers -ContentType "application/zip" -InFile "english3000-windows.zip"

  windows-oneclick:
    runs-on: windows-latest
    outputs:
      oneclick_size: ${{ steps.hash.outputs.ONECLICK_SIZE }}
      oneclick_sha256: ${{ steps.hash.outputs.ONECLICK_SHA256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.7.*"
          cache: true
      - name: Set build id
        id: buildid
        shell: pwsh
        run: |
          $bid = "build-${{ github.run_id }}-${{ github.sha }}"
          Write-Output "BUILD_ID=$bid" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
      - name: Build
        env:
          ENGLISH3000_BUILD_ID: ${{ steps.buildid.outputs.BUILD_ID }}
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release
      - name: Deploy Qt runtime
        run: windeployqt --release --no-translations build/Release/english3000.exe
      - name: Bundle assets
        run: Copy-Item -Recurse assets build/Release/assets
      - name: Download llama.cpp
        run: |
          curl.exe -L --fail --retry 3 --connect-timeout 30 -o llama-vulkan.zip "https://github.com/ggml-org/llama.cpp/releases/download/b10423/llama-b10423-bin-win-vulkan-x64.zip"
          curl.exe -L --fail --retry 3 --connect-timeout 30 -o llama-cpu.zip "https://github.com/ggml-org/llama.cpp/releases/download/b10423/llama-b10423-bin-win-cpu-x64.zip"
          curl.exe -L --fail --retry 3 --connect-timeout 30 -o llama-cuda.zip "https://github.com/ggml-org/llama.cpp/releases/download/b10423/llama-b10423-bin-win-cuda-12.4-x64.zip"
          Expand-Archive llama-vulkan.zip -DestinationPath llama-vulkan
          Expand-Archive llama-cpu.zip -DestinationPath llama-cpu
          Expand-Archive llama-cuda.zip -DestinationPath llama-cuda
      - name: Download small model
        run: |
          New-Item -ItemType Directory -Force -Path llama-vulkan | Out-Null
          curl.exe -L --fail --retry 3 --connect-timeout 30 -o llama-vulkan\qwen2.5-1.5b-instruct-q4_k_m.gguf "https://huggingface.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF/resolve/main/qwen2.5-1.5b-instruct-q4_k_m.gguf"
      - name: Download tools
        run: |
          curl.exe -L --fail --retry 3 --connect-timeout 30 -o sqlite.zip "https://www.sqlite.org/2026/sqlite-tools-win-x64-3530400.zip"
          Expand-Archive sqlite.zip -DestinationPath sqlite
          choco install innosetup -y --no-progress
      - name: Assemble package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path oneclick\English3000\llama\vulkan | Out-Null
          New-Item -ItemType Directory -Force -Path oneclick\English3000\llama\cpu | Out-Null
          New-Item -ItemType Directory -Force -Path oneclick\English3000\llama\cuda | Out-Null
          Copy-Item build/Release/* oneclick\English3000\ -Recurse -Force
          Copy-Item llama-vulkan\llama-server.exe oneclick\English3000\llama\vulkan\ -Force
          Get-ChildItem llama-vulkan -Recurse -Filter *.dll | ForEach-Object { Copy-Item $_.FullName oneclick\English3000\llama\vulkan\ -Force }
          Copy-Item llama-cpu\llama-server.exe oneclick\English3000\llama\cpu\ -Force
          Get-ChildItem llama-cpu -Recurse -Filter *.dll | ForEach-Object { Copy-Item $_.FullName oneclick\English3000\llama\cpu\ -Force }
          Copy-Item llama-cuda\llama-server.exe oneclick\English3000\llama\cuda\ -Force
          Get-ChildItem llama-cuda -Recurse -Filter *.dll | ForEach-Object { Copy-Item $_.FullName oneclick\English3000\llama\cuda\ -Force }
          Copy-Item llama-vulkan\qwen2.5-1.5b-instruct-q4_k_m.gguf oneclick\English3000\llama\ -Force
          Copy-Item tools\start-llama.ps1 oneclick\English3000\ -Force
          Get-ChildItem sqlite -Recurse -Filter sqlite3.exe | ForEach-Object { Copy-Item $_.FullName oneclick\English3000\ -Force }
          $sum = (Get-ChildItem oneclick -Recurse -File | Measure-Object -Property Length -Sum).Sum
          Write-Host "package size: $([math]::Round($sum/1MB,1)) MB"
      - name: Build Inno installer
        id: inno
        shell: pwsh
        run: |
          $iscc = @("C:\Program Files (x86)\Inno Setup 6\ISCC.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { $iscc = Get-ChildItem "C:\Program Files*\Inno Setup*" -Recurse -Filter ISCC.exe -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName }
          if (-not $iscc) { Write-Error "ISCC.exe not found"; exit 1 }
          Write-Host "ISCC: $iscc"
          & $iscc /Qp tools\oneclick_installer.iss 2>&1 | Tee-Object -FilePath iscc.log
          if ($LASTEXITCODE -ne 0) { Write-Host "ISCC failed with exit $LASTEXITCODE"; exit $LASTEXITCODE }
          Get-Item English3000-OneClick-Setup.exe | ForEach-Object { Write-Host "installer size: $([math]::Round($_.Length/1MB,1)) MB" }
      - name: Compute hash
        id: hash
        shell: pwsh
        run: |
          $h = Get-FileHash English3000-OneClick-Setup.exe -Algorithm SHA256
          $s = (Get-Item English3000-OneClick-Setup.exe).Length
          Write-Output "ONECLICK_SIZE=$s" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Output "ONECLICK_SHA256=$($h.Hash.ToLower())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
      - name: Upload build failure log
        if: failure() && steps.inno.conclusion == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          if (-not (Test-Path iscc.log)) { exit 0 }
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = "application/vnd.github+json" }
          $uri = "https://api.github.com/repos/${{ github.repository }}/releases"
          $release = $null
          try { $release = Invoke-RestMethod -Method Get -Uri "$uri/tags/win-oneclick" -Headers $headers } catch { }
          if ($null -eq $release) {
            $body = @{ tag_name = "win-oneclick"; name = "Windows One-Click"; body = "Build diagnostics"; draft = $false; prerelease = $false } | ConvertTo-Json
            $release = Invoke-RestMethod -Method Post -Uri $uri -Headers $headers -ContentType "application/json" -Body $body
          }
          foreach ($asset in $release.assets) {
            if ($asset.name -eq "iscc-error.log") {
              Invoke-RestMethod -Method Delete -Uri "https://api.github.com/repos/${{ github.repository }}/releases/assets/$($asset.id)" -Headers $headers
            }
          }
          $uploadUri = "https://uploads.github.com/repos/${{ github.repository }}/releases/$($release.id)/assets?name=iscc-error.log"
          Invoke-RestMethod -Method Post -Uri $uploadUri -Headers $headers -ContentType "text/plain" -InFile iscc.log
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: english3000-windows-oneclick
          path: English3000-OneClick-Setup.exe
      - name: Publish one-click release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = "application/vnd.github+json" }
          $uri = "https://api.github.com/repos/${{ github.repository }}/releases"
          $release = $null
          try { $release = Invoke-RestMethod -Method Get -Uri "$uri/tags/win-oneclick" -Headers $headers } catch { }
          if ($null -eq $release) {
            $body = @{ tag_name = "win-oneclick"; name = "Windows 一键版（含本地小模型）"; body = "应用 + 本地 AI + Qwen2.5 1.5B 模型，安装即用"; draft = $false; prerelease = $false } | ConvertTo-Json
            $release = Invoke-RestMethod -Method Post -Uri $uri -Headers $headers -ContentType "application/json" -Body $body
          }
          foreach ($asset in $release.assets) {
            if ($asset.name -eq "English3000-OneClick-Setup.exe" -or $asset.name -eq "iscc-error.log") {
              Invoke-RestMethod -Method Delete -Uri "https://api.github.com/repos/${{ github.repository }}/releases/assets/$($asset.id)" -Headers $headers
            }
          }
          $uploadUri = "https://uploads.github.com/repos/${{ github.repository }}/releases/$($release.id)/assets?name=English3000-OneClick-Setup.exe"
          Invoke-RestMethod -Method Post -Uri $uploadUri -Headers $headers -ContentType "application/octet-stream" -InFile "English3000-OneClick-Setup.exe"

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            platforms;android-34
            build-tools;34.0.0
            ndk;25.2.9519653
      - id: installqt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.7.*"
          host: "linux"
          target: "android"
          arch: "android_arm64_v8a"
          cache: true
      - name: Configure
        run: |
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/25.2.9519653" >> $GITHUB_ENV
      - name: Keep only android-34 platform
        run: |
          find $ANDROID_SDK_ROOT/platforms -mindepth 1 -maxdepth 1 -type d \
            ! -name 'android-34' -exec rm -rf {} +
      - name: Configure
        run: |
          cmake -B build-android -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=$QT_ROOT_DIR/lib/cmake/Qt6/qt.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a
      - name: Build APK
        run: cmake --build build-android --target apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: english3000-android
          path: build-android/android-build/*.apk
      - name: Publish Android release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $apk = Get-ChildItem build-android\android-build -Filter *.apk | Select-Object -First 1 -ExpandProperty FullName
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = "application/vnd.github+json" }
          $uri = "https://api.github.com/repos/${{ github.repository }}/releases"
          $release = $null
          try { $release = Invoke-RestMethod -Method Get -Uri "$uri/tags/android-latest" -Headers $headers } catch { }
          if ($null -eq $release) {
            $body = @{ tag_name = "android-latest"; name = "安卓最新版"; body = "自动构建 ${{ github.sha }}"; draft = $false; prerelease = $false } | ConvertTo-Json
            $release = Invoke-RestMethod -Method Post -Uri $uri -Headers $headers -ContentType "application/json" -Body $body
          }
          foreach ($asset in $release.assets) {
            if ($asset.name -eq "english3000-mobile.apk") {
              Invoke-RestMethod -Method Delete -Uri "https://api.github.com/repos/${{ github.repository }}/releases/assets/$($asset.id)" -Headers $headers
            }
          }
          $uploadUri = "https://uploads.github.com/repos/${{ github.repository }}/releases/$($release.id)/assets?name=english3000-mobile.apk"
          Invoke-RestMethod -Method Post -Uri $uploadUri -Headers $headers -ContentType "application/vnd.android.package-archive" -InFile $apk

  update-meta:
    runs-on: ubuntu-latest
    needs: [windows, windows-oneclick]
    steps:
      - name: Generate update json
        run: |
          cat > english3000-update.json <<EOF
          {
            "build_id": "${{ needs.windows.outputs.build_id }}",
            "version": "1.0.0",
            "desktop_url": "https://github.com/${{ github.repository }}/releases/download/win-latest/english3000-windows.zip",
            "oneclick_url": "https://github.com/${{ github.repository }}/releases/download/win-oneclick/English3000-OneClick-Setup.exe",
            "desktop_size": ${{ needs.windows.outputs.desktop_size }},
            "desktop_sha256": "${{ needs.windows.outputs.desktop_sha256 }}",
            "oneclick_size": ${{ needs['windows-oneclick'].outputs.oneclick_size }},
            "oneclick_sha256": "${{ needs['windows-oneclick'].outputs.oneclick_sha256 }}",
            "notes": "自动构建 ${{ github.sha }}"
          }
          EOF
      - name: Publish update json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          REPO="${{ github.repository }}"
          AUTH="Authorization: Bearer $GH_TOKEN"
          ACCEPT="Accept: application/vnd.github+json"
          release=$(curl -sS -H "$AUTH" -H "$ACCEPT" "https://api.github.com/repos/$REPO/releases/tags/app-update" || true)
          if ! echo "$release" | grep -q '"id"'; then
            body='{"tag_name":"app-update","name":"应用更新清单","body":"自动更新元数据","draft":false,"prerelease":false}'
            release=$(curl -sS -X POST -H "$AUTH" -H "$ACCEPT" -d "$body" "https://api.github.com/repos/$REPO/releases")
          fi
          RID=$(echo "$release" | python3 -c "import json,sys; print(json.load(sys.stdin)['id'])")
          AID=$(echo "$release" | python3 -c "import json,sys; d=json.load(sys.stdin); print(next((str(a['id']) for a in d.get('assets',[]) if a['name']=='english3000-update.json'), ''))")
          if [ -n "$AID" ]; then
            curl -sS -X DELETE -H "$AUTH" -H "$ACCEPT" "https://api.github.com/repos/$REPO/releases/assets/$AID"
          fi
          curl -sS -X POST -H "$AUTH" -H "Content-Type: application/json" \
            --data-binary @english3000-update.json \
            "https://uploads.github.com/repos/$REPO/releases/$RID/assets?name=english3000-update.json"
