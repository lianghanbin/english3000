name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.7.*"
          cache: true
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxcb1-dev libgl1-mesa-dev ninja-build
      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.7.*"
          cache: true
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release
      - name: Deploy Qt runtime
        run: windeployqt --release --no-translations build/Release/english3000.exe
      - name: Bundle assets
        run: Copy-Item -Recurse assets build/Release/assets
      - name: Package zip
        run: Compress-Archive -Path build/Release/* -DestinationPath english3000-windows.zip
      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: english3000-windows
          path: english3000-windows.zip
