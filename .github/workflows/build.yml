name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.7.*"
          cache: true
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxcb1-dev libgl1-mesa-dev ninja-build
      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.7.*"
          cache: true
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release
      - name: Deploy Qt runtime
        run: windeployqt --release --no-translations build/Release/english3000.exe
      - name: Bundle assets
        run: Copy-Item -Recurse assets build/Release/assets
      - name: Package zip
        run: Compress-Archive -Path build/Release/* -DestinationPath english3000-windows.zip
      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: english3000-windows
          path: english3000-windows.zip

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            platforms;android-34
            build-tools;34.0.0
            ndk;25.2.9519653
      - id: installqt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.7.*"
          host: "linux"
          target: "android"
          arch: "android_arm64_v8a"
          cache: true
      - name: Configure
        run: |
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/25.2.9519653" >> $GITHUB_ENV
      - name: Remove broken android-36 platform
        run: rm -rf $ANDROID_SDK_ROOT/platforms/android-36-ext19
      - name: Configure
        run: |
          cmake -B build-android -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=$QT_ROOT_DIR/lib/cmake/Qt6/qt.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a
      - name: Build APK
        run: cmake --build build-android --target apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: english3000-android
          path: build-android/android-build/*.apk
