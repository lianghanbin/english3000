<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; background: #0d1117; overflow: hidden; }
  #stage { position: fixed; inset: 0; }
  .scene { position: absolute; inset: 0; opacity: 0; pointer-events: none; }
  .scene.on { opacity: 1; }

  /* ---------- 场景1：词表格子（字库感） ---------- */
  #grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 3vmin;
          place-content: center; padding: 8vmin; }
  #grid .cell { aspect-ratio: 1; border-radius: 1.2vmin; background: #1c2733;
                opacity: 0; transform: scale(0.4); }
  #grid.on .cell { animation: cellIn 0.7s ease-out forwards; }
  #grid.on .cell:nth-child(6n+1) { animation-delay: 0.1s; }
  #grid.on .cell:nth-child(6n+2) { animation-delay: 0.25s; }
  #grid.on .cell:nth-child(6n+3) { animation-delay: 0.4s; }
  #grid.on .cell:nth-child(6n+4) { animation-delay: 0.55s; }
  #grid.on .cell:nth-child(6n+5) { animation-delay: 0.7s; }
  #grid .cell.lit { background: #2e7d32; box-shadow: 0 0 3vmin rgba(46,125,50,0.5); }
  @keyframes cellIn { to { opacity: 1; transform: scale(1); } }

  /* ---------- 场景2：点词波纹 ---------- */
  #ripple { display: grid; place-content: center; }
  #ripple .core { width: 12vmin; height: 12vmin; border-radius: 50%;
                  background: radial-gradient(circle at 35% 35%, #43a047, #1b5e20);
                  box-shadow: 0 0 5vmin rgba(46,125,50,0.6); }
  #ripple .ring { position: absolute; left: 50%; top: 50%; width: 12vmin;
                  height: 12vmin; margin: -6vmin 0 0 -6vmin; border-radius: 50%;
                  border: 0.5vmin solid rgba(255,255,255,0.35); opacity: 0; }
  #ripple.on .ring { animation: ringOut 1.1s ease-out infinite; }
  #ripple.on .ring:nth-of-type(2) { animation-delay: 0.36s; }
  #ripple.on .ring:nth-of-type(3) { animation-delay: 0.72s; }
  @keyframes ringOut {
    0% { transform: scale(1); opacity: 0.7; }
    100% { transform: scale(3.2); opacity: 0; }
  }

  /* ---------- 场景3：词块汇聚成文 ---------- */
  #merge .block { position: absolute; width: 5vmin; height: 3vmin;
                  border-radius: 0.8vmin; background: #2e7d32; opacity: 0; }
  #merge.on .block { animation: toLine 1.4s ease-in-out forwards; }
  @keyframes toLine {
    0% { opacity: 0; }
    15% { opacity: 1; }
    100% { left: 50%; top: 50%; margin: -1.5vmin 0 0 -32vmin;
           opacity: 0.9; transform: none; }
  }
  #merge .sentence { position: absolute; left: 50%; top: 50%;
                     transform: translate(-50%, -50%); width: 64vmin; height: 3vmin;
                     background: linear-gradient(90deg, transparent, #c8e6c9, transparent);
                     opacity: 0; }
  #merge.on .sentence { animation: lineGlow 2.4s ease-in-out 1.5s forwards; }
  @keyframes lineGlow { 0% { opacity: 0; } 25% { opacity: 1; } 100% { opacity: 0.4; } }

  /* ---------- 场景4：推门光晕 ---------- */
  #door .crack { position: absolute; left: 50%; top: 8%; width: 0.6vmin;
                 height: 84%; margin-left: -0.3vmin; background: #c8e6c9;
                 transform: scaleY(0.05); opacity: 0; }
  #door.on .crack { animation: crackOpen 1.2s ease-out forwards; }
  @keyframes crackOpen { 0% { opacity: 0; transform: scaleY(0.05); }
                         30% { opacity: 1; } 100% { opacity: 1; transform: scaleY(1); } }
  #door .glow { position: absolute; left: 50%; top: 50%; width: 10vmin; height: 10vmin;
                margin: -5vmin 0 0 -5vmin; border-radius: 50%;
                background: radial-gradient(circle, rgba(200,230,201,0.9), rgba(200,230,201,0));
                opacity: 0; }
  #door.on .glow { animation: glowOut 2.2s ease-out 1.2s forwards; }
  @keyframes glowOut { 0% { opacity: 0; transform: scale(0.2); }
                       60% { opacity: 0.8; } 100% { opacity: 0; transform: scale(14); } }

  /* ---------- 场景5：收敛归一 ---------- */
  #gather .point { position: absolute; left: 50%; top: 50%; width: 8vmin; height: 8vmin;
                   margin: -4vmin 0 0 -4vmin; border-radius: 50%;
                   background: radial-gradient(circle, #e8f5e9, #2e7d32 60%, transparent 70%);
                   opacity: 0; }
  #gather.on .point { animation: pointIn 2.4s ease-in-out forwards; }
  @keyframes pointIn { 0% { opacity: 0; transform: scale(0.2); }
                       30% { opacity: 1; transform: scale(1); }
                       100% { opacity: 0; transform: scale(1.8); } }
</style>
</head>
<body>
<div id="stage">
  <div class="scene" id="grid">
    <div class="cell"></div><div class="cell"></div><div class="cell"></div>
    <div class="cell"></div><div class="cell"></div><div class="cell"></div>
    <div class="cell"></div><div class="cell"></div><div class="cell"></div>
    <div class="cell"></div><div class="cell"></div><div class="cell"></div>
    <div class="cell"></div><div class="cell"></div><div class="cell"></div>
    <div class="cell"></div><div class="cell"></div><div class="cell"></div>
    <div class="cell"></div><div class="cell"></div><div class="cell"></div>
    <div class="cell"></div><div class="cell"></div><div class="cell"></div>
    <div class="cell"></div>
  </div>
  <div class="scene" id="ripple">
    <div class="core"></div>
    <div class="ring"></div><div class="ring"></div><div class="ring"></div>
  </div>
  <div class="scene" id="merge">
    <div class="sentence"></div>
    <div class="block" style="left:8%; top:18%"></div>
    <div class="block" style="left:76%; top:14%"></div>
    <div class="block" style="left:12%; top:66%"></div>
    <div class="block" style="left:82%; top:70%"></div>
    <div class="block" style="left:20%; top:40%"></div>
    <div class="block" style="left:68%; top:38%"></div>
    <div class="block" style="left:30%; top:80%"></div>
    <div class="block" style="left:60%; top:82%"></div>
    <div class="block" style="left:44%; top:12%"></div>
    <div class="block" style="left:50%; top:88%"></div>
  </div>
  <div class="scene" id="door">
    <div class="crack"></div>
    <div class="glow"></div>
  </div>
  <div class="scene" id="gather">
    <div class="point"></div>
  </div>
</div>
<script>
  const scenes = ["grid", "ripple", "merge", "door", "gather"];
  const durations = [8, 10, 12, 8, 6];
  const litDelay = 2800;
  let i = 0;
  const el = id => document.getElementById(id);

  function play(idx) {
    if (idx >= scenes.length) return;
    const name = scenes[idx];
    el(name).classList.add("on");
    if (name === "grid") {
      setTimeout(() => {
        const cells = el("grid").querySelectorAll(".cell");
        let k = 0;
        const t = setInterval(() => {
          if (k >= cells.length) { clearInterval(t); return; }
          cells[k].classList.add("lit");
          k += 6;
        }, 180);
      }, litDelay);
    }
    setTimeout(() => {
      el(name).classList.remove("on");
      play(idx + 1);
    }, durations[idx] * 1000);
  }
  play(0);
</script>
</body>
</html>
